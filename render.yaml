services:
  - type: web
    name: docretriever-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: POSTGRES_HOST
        fromDatabase:
          name: docretriever-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: docretriever-db
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: docretriever-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: docretriever-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: docretriever-db
          property: database
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: docretriever-db
    plan: free
    databaseName: docretriever_db
    user: docretriever
